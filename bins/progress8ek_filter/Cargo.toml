[package]
name = "progress8ek-filter"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
publish = false

[lints]
workspace = true

[[bin]]
name = "progress8ek-filter"
path = "src/main.rs"

[[bin]]
name = "progress8ek-verify-network"
path = "src/verify_network.rs"

[[bin]]
name = "progress8ek-partition"
path = "src/partition.rs"

[[bin]]
name = "progress8ek-audit-psv"
path = "src/audit_psv.rs"

[dependencies]
clap = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shogi-features = { workspace = true }
shogi-format = { workspace = true }
nnue-format = { workspace = true }
